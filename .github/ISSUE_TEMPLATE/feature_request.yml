name: Improvement idea
description: Suggest a change to the Huge Company website.
title: "[Idea]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "Share the user need and the outcome you would like to see."
  - type: textarea
    id: need
    attributes:
      label: What would you like to improve?
      description: Describe the problem or opportunity.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would a good outcome look like?
      description: Describe your suggested behavior or experience.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, references, or screenshots if useful.
    validations:
      required: false
